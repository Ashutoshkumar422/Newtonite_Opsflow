[project]
name = "opsflow-backend"
version = "0.1.0"
description = "OpsFlow — operational work management API (Newtonite engineering challenge)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyjwt>=2.8",
    "bcrypt>=4.1",
    "cryptography>=42",  # RS256 ID-token verification for OIDC SSO
    "httpx>=0.27",  # OIDC discovery / token exchange
    "python-multipart>=0.0.9",  # form posts in the bundled development identity provider
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
]
docs = [
    "reportlab>=4",  # builds OpsFlow_Guide.pdf (docs/guide/build_guide.py)
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning:starlette.*", "ignore:Using `httpx`"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.ruff.lint.per-file-ignores]
"app/seed.py" = ["E501"]  # embedded SQL
"tests/**" = ["E501"]  # long assertion lines read better unwrapped
"scripts/**" = ["E501"]
"app/devtools/**" = ["E501"]  # inline HTML page

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]
